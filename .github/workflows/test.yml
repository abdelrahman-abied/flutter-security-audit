name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Two runners on purpose: the scanner is bash + grep + awk, and those are
    # exactly the tools that differ between platforms. ubuntu-latest gives GNU
    # grep and mawk; macos-latest gives BSD grep, the one-true-awk, and bash 3.2.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain under test
        run: |
          bash --version | head -1
          grep --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1

      - name: Regression suite
        run: bash tests/test.sh
